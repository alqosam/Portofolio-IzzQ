<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Momen Kelas 12 - Muhammad Izzudin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(51, 65, 85, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; min-height: 100vh; }

        nav {
            padding: 1rem 5%;
            background: rgba(11, 17, 32, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-weight: 800; color: var(--accent); text-decoration: none; font-size: 1.2rem; }
        .back-btn {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 0.4rem 1.1rem;
            border: 1px solid var(--border);
            border-radius: 50px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .back-btn:hover { color: var(--accent); border-color: var(--accent); background: rgba(56, 189, 248, 0.1); }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 5%; }

        .hero-banner {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .hero-banner h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .hero-banner p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 500px;
            margin: 0 auto 1.5rem;
        }

        .upload-btn-label {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--accent);
            color: #0b1120;
            font-weight: 700;
            padding: 0.7rem 1.6rem;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-btn-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }

        #fileInput { display: none; }

        .drive-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .drive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.25rem;
            margin-top: 1rem;
        }

        .drive-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .drive-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .drive-thumb {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
            background: #0f172a;
        }

        .drive-info {
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.8);
        }

        .drive-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
            background: rgba(30, 41, 59, 0.3);
            border-radius: 14px;
            border: 1px dashed var(--border);
        }

        .status-msg {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--accent);
            display: none;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">@IZZQ</a>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</a>
    </nav>

    <div class="container">
        <div class="hero-banner">
            <h1><i class="fa-solid fa-images"></i> Album Momen Kelas 12</h1>
            <p class="subtitle">Kumpulan kenangan dan foto dokumentasi SMKN 1 Gantiwarno.</p>
            
            <label for="fileInput" class="upload-btn-label">
                <i class="fa-solid fa-cloud-arrow-up"></i> Upload Foto
                <input type="file" id="fileInput" multiple accept="image/*">
            </label>
            <div id="statusMsg" class="status-msg">Memproses upload ke Cloud...</div>
        </div>

        <div class="drive-header">
            <span><i class="fa-solid fa-folder-open"></i> Galeri Foto Publik (<span id="photoCount">0</span> item)</span>
        </div>

        <div class="drive-grid" id="driveGrid">
            <div class="empty-state" id="emptyState">
                <i class="fa-solid fa-images" style="font-size: 2.5rem; margin-bottom: 0.8rem; color: var(--accent);"></i>
                <p>Belum ada foto publik. Klik <strong>Upload Foto</strong> untuk menambahkan foto pertama!</p>
            </div>
        </div>
    </div>

    <script>
        // === GANTI 2 DATA DI BAWAH SESUAI DASHBOARD CLOUDINARY-MU ===
        const CLOUD_NAME = "dsqtmo7b"; 
        const UPLOAD_PRESET = "momen_kelas12"; 
        const TAG_NAME = "momen_kelas12";

        const fileInput = document.getElementById('fileInput');
        const driveGrid = document.getElementById('driveGrid');
        const emptyState = document.getElementById('emptyState');
        const photoCount = document.getElementById('photoCount');
        const statusMsg = document.getElementById('statusMsg');

        async function fetchPublicPhotos() {
            try {
                const response = await fetch(`https://res.cloudinary.com/${CLOUD_NAME}/image/list/${TAG_NAME}.json`);
                if (!response.ok) throw new Error('Belum ada data');
                const data = await response.json();
                renderPhotos(data.resources);
            } catch (err) {
                console.log("Belum ada foto ter-tag atau Resource List belum diaktifkan.");
                renderPhotos([]);
            }
        }

        function renderPhotos(resources) {
            driveGrid.innerHTML = '';
            
            if (!resources || resources.length === 0) {
                driveGrid.appendChild(emptyState);
                emptyState.style.display = 'block';
                photoCount.textContent = '0';
                return;
            }

            emptyState.style.display = 'none';
            photoCount.textContent = resources.length;

            resources.forEach(img => {
                const imgUrl = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/v${img.version}/${img.public_id}.${img.format}`;
                const card = document.createElement('div');
                card.className = 'drive-card';
                card.innerHTML = `
                    <a href="${imgUrl}" target="_blank">
                        <img src="${imgUrl}" class="drive-thumb" alt="Momen foto">
                    </a>
                    <div class="drive-info">
                        <span class="drive-name">Momen #${img.public_id.substring(0, 8)}</span>
                    </div>
                `;
                driveGrid.appendChild(card);
            });
        }

        fileInput.addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            statusMsg.style.display = 'block';
            statusMsg.textContent = 'Mengupload foto ke server cloud...';

            for (const file of files) {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', UPLOAD_PRESET);
                formData.append('tags', TAG_NAME);

                try {
                    await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                        method: 'POST',
                        body: formData
                    });
                } catch (err) {
                    console.error('Gagal upload:', err);
                }
            }

            statusMsg.textContent = 'Upload berhasil!';
            setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
            
            // Refresh galeri
            fetchPublicPhotos();
            fileInput.value = '';
        });

        fetchPublicPhotos();
    </script>

</body>
</html>
