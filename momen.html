<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Momen Kelas 12 - Muhammad Izzudin</title>
    <link rel="icon" type="image/png" href="profil.jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(51, 65, 85, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; min-height: 100vh; }

        nav {
            padding: 1rem 5%;
            background: rgba(11, 17, 32, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-weight: 800; color: var(--accent); text-decoration: none; font-size: 1.2rem; }
        .back-btn {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            padding: 0.4rem 1.1rem;
            border: 1px solid var(--border);
            border-radius: 50px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .back-btn:hover { color: var(--accent); border-color: var(--accent); background: rgba(56, 189, 248, 0.1); }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 5%; }

        .hero-banner {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .hero-banner h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .hero-banner p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 500px;
            margin: 0 auto 1.5rem;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--accent);
            color: #0b1120;
            font-weight: 700;
            padding: 0.7rem 1.4rem;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }

        .btn-outline-action {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
            margin-left: 0.5rem;
        }
        .btn-outline-action:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        #fileInput { display: none; }

        .drive-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }
        .breadcrumb:hover { color: var(--accent); }

        /* Grid Laci / Folder */
        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-top: 1rem;
        }

        .folder-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .folder-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .folder-icon {
            font-size: 2.2rem;
            color: var(--accent);
            margin-bottom: 0.75rem;
        }

        .folder-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 0.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .folder-date {
            font-size: 0.78rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .folder-footer {
            margin-top: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Grid Foto Dalam Laci */
        .drive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.25rem;
            margin-top: 1rem;
        }

        .drive-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .drive-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .drive-thumb {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
            background: #0f172a;
        }

        .drive-info {
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drive-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
            display: block;
        }

        .delete-btn {
            color: #ef4444;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .delete-btn:hover { color: #f87171; }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
            background: rgba(30, 41, 59, 0.3);
            border-radius: 14px;
            border: 1px dashed var(--border);
        }

        .status-msg {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--accent);
            display: none;
        }

        /* Modal Pop-up Tambah Laci */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 17, 32, 0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 2rem;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal-content h3 {
            margin-bottom: 1rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text-main);
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--accent);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">@IZZQ</a>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</a>
    </nav>

    <div class="container">
        <div class="hero-banner">
            <h1><i class="fa-solid fa-box-archive"></i> Album & Laci Momen</h1>
            <p class="subtitle" id="bannerSubtitle">Kelompokkan foto dokumentasi berdasarkan tanggal dan nama acara.</p>
            
            <div id="bannerButtons">
                <button class="btn-action" onclick="openModal()"><i class="fa-solid fa-folder-plus"></i> + Buat Laci Baru</button>
            </div>
            
            <div id="statusMsg" class="status-msg">Memproses...</div>
        </div>

        <div class="drive-header">
            <span class="breadcrumb" id="breadcrumb" onclick="goHome()">
                <i class="fa-solid fa-folder-open"></i> <span id="currentPath">Daftar Laci Momen</span>
            </span>
            <span id="itemCounter">0 Laci</span>
        </div>

        <!-- Tampilan 1: Daftar Laci Folder -->
        <div class="folder-grid" id="folderGrid"></div>

        <!-- Tampilan 2: Isi Foto Dalam Laci -->
        <div class="drive-grid" id="driveGrid" style="display: none;"></div>
    </div>

    <!-- Modal Buat Laci Baru -->
    <div class="modal" id="laciModal">
        <div class="modal-content">
            <h3><i class="fa-solid fa-folder-plus"></i> Buat Laci Momen</h3>
            <div class="form-group">
                <label for="laciName">Nama Laci / Acara</label>
                <input type="text" id="laciName" placeholder="Contoh: Praktikum Server, Buka Bersama">
            </div>
            <div class="form-group">
                <label for="laciDate">Tanggal Momen</label>
                <input type="date" id="laciDate">
            </div>
            <div class="modal-actions">
                <button class="btn-action btn-outline-action" onclick="closeModal()">Batal</button>
                <button class="btn-action" onclick="createLaci()">Simpan Laci</button>
            </div>
        </div>
    </div>

    <script>
        const CLOUD_NAME = "dsqtmo7b"; 
        const UPLOAD_PRESET = "momen_kelas12"; 
        const TAG_NAME = "momen_kelas12";

        const folderGrid = document.getElementById('folderGrid');
        const driveGrid = document.getElementById('driveGrid');
        const bannerButtons = document.getElementById('bannerButtons');
        const bannerSubtitle = document.getElementById('bannerSubtitle');
        const currentPath = document.getElementById('currentPath');
        const itemCounter = document.getElementById('itemCounter');
        const statusMsg = document.getElementById('statusMsg');
        const laciModal = document.getElementById('laciModal');

        let lacis = JSON.parse(localStorage.getItem('momen_lacis') || '[]');
        let activeLaciId = null;

        // Inisialisasi Laci Default Jika Masih Kosong
        if (lacis.length === 0) {
            lacis = [
                { id: 'laci-1', name: 'Praktikum Network Lab', date: '2026-03-15', photos: [] },
                { id: 'laci-2', name: 'Momen Kelas & Istirahat', date: '2026-04-10', photos: [] }
            ];
            localStorage.setItem('momen_lacis', JSON.stringify(lacis));
        }

        function renderLaciView() {
            activeLaciId = null;
            folderGrid.style.display = 'grid';
            driveGrid.style.display = 'none';
            
            currentPath.innerHTML = 'Daftar Laci Momen';
            bannerSubtitle.textContent = 'Kelompokkan foto dokumentasi berdasarkan tanggal dan nama acara.';
            itemCounter.textContent = lacis.length + ' Laci';

            bannerButtons.innerHTML = `
                <button class="btn-action" onclick="openModal()"><i class="fa-solid fa-folder-plus"></i> + Buat Laci Baru</button>
            `;

            folderGrid.innerHTML = '';
            if (lacis.length === 0) {
                folderGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-folder-open" style="font-size: 2.5rem; margin-bottom: 0.8rem; color: var(--accent);"></i>
                        <p>Belum ada laci momen. Klik <strong>+ Buat Laci Baru</strong> untuk mulai menata foto!</p>
                    </div>
                `;
                return;
            }

            lacis.forEach((laci, index) => {
                const card = document.createElement('div');
                card.className = 'folder-card';
                card.onclick = () => openLaci(laci.id);
                card.innerHTML = `
                    <div class="folder-icon"><i class="fa-solid fa-folder-closed"></i></div>
                    <div class="folder-title" title="${laci.name}">${laci.name}</div>
                    <div class="folder-date"><i class="fa-regular fa-calendar-days"></i> ${laci.date || 'Tanpa Tanggal'}</div>
                    <div class="folder-footer">
                        <span><i class="fa-solid fa-image"></i> ${laci.photos.length} foto</span>
                        <button class="delete-btn" onclick="deleteLaci(event, ${index})" title="Hapus Laci"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
                folderGrid.appendChild(card);
            });
        }

        function openLaci(id) {
            activeLaciId = id;
            const laci = lacis.find(l => l.id === id);
            if (!laci) return;

            folderGrid.style.display = 'none';
            driveGrid.style.display = 'grid';

            currentPath.innerHTML = `<span onclick="goHome()">Daftar Laci</span> / <strong>${laci.name}</strong>`;
            bannerSubtitle.textContent = `Laci: ${laci.name} (${laci.date || 'Tanpa Tanggal'})`;
            itemCounter.textContent = laci.photos.length + ' foto';

            bannerButtons.innerHTML = `
                <button class="btn-action btn-outline-action" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i> Kembali ke Laci</button>
                <label for="fileInput" class="btn-action">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Upload Foto ke Laci Ini
                    <input type="file" id="fileInput" multiple accept="image/*" onchange="uploadPhotoToLaci(event)">
                </label>
            `;

            renderPhotos(laci.photos);
        }

        function renderPhotos(photos) {
            driveGrid.innerHTML = '';
            if (photos.length === 0) {
                driveGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-images" style="font-size: 2.5rem; margin-bottom: 0.8rem; color: var(--accent);"></i>
                        <p>Laci ini masih kosong. Klik <strong>Upload Foto ke Laci Ini</strong> untuk menambahkan foto!</p>
                    </div>
                `;
                return;
            }

            photos.forEach((img, idx) => {
                const card = document.createElement('div');
                card.className = 'drive-card';
                card.innerHTML = `
                    <a href="${img.url}" target="_blank">
                        <img src="${img.url}" class="drive-thumb" alt="Momen foto">
                    </a>
                    <div class="drive-info">
                        <span class="drive-name" title="${img.name}">${img.name}</span>
                        <button class="delete-btn" onclick="deletePhotoInLaci(${idx})" title="Hapus foto"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
                driveGrid.appendChild(card);
            });
        }

        async function uploadPhotoToLaci(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0 || !activeLaciId) return;

            const laci = lacis.find(l => l.id === activeLaciId);
            if (!laci) return;

            statusMsg.style.display = 'block';
            statusMsg.textContent = 'Mengupload foto ke Cloud...';

            for (const file of files) {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', UPLOAD_PRESET);
                formData.append('tags', TAG_NAME);

                try {
                    const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    
                    if (data.secure_url) {
                        laci.photos.unshift({
                            url: data.secure_url,
                            name: file.name
                        });
                    }
                } catch (err) {
                    console.error('Gagal upload:', err);
                }
            }

            localStorage.setItem('momen_lacis', JSON.stringify(lacis));
            openLaci(activeLaciId);

            statusMsg.textContent = 'Upload Berhasil!';
            setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
        }

        function openModal() { laciModal.style.display = 'flex'; }
        function closeModal() { laciModal.style.display = 'none'; }

        function createLaci() {
            const name = document.getElementById('laciName').value.trim();
            const date = document.getElementById('laciDate').value;

            if (!name) {
                alert("Harap isi nama laci / acaranya!");
                return;
            }

            const newLaci = {
                id: 'laci-' + Date.now(),
                name: name,
                date: date,
                photos: []
            };

            lacis.unshift(newLaci);
            localStorage.setItem('momen_lacis', JSON.stringify(lacis));
            
            document.getElementById('laciName').value = '';
            document.getElementById('laciDate').value = '';
            closeModal();
            renderLaciView();
        }

        function deleteLaci(e, index) {
            e.stopPropagation();
            const yakin = confirm(`Apakah Paduka Osa yakin mau menghapus laci "${lacis[index].name}" beserta semua fotonya?`);
            if (yakin) {
                lacis.splice(index, 1);
                localStorage.setItem('momen_lacis', JSON.stringify(lacis));
                renderLaciView();
            }
        }

        function deletePhotoInLaci(photoIndex) {
            const laci = lacis.find(l => l.id === activeLaciId);
            if (!laci) return;

            const yakin = confirm("Apakah Anda yakin menghapus foto ini?😭");
            if (yakin) {
                laci.photos.splice(photoIndex, 1);
                localStorage.setItem('momen_lacis', JSON.stringify(lacis));
                openLaci(activeLaciId);
            }
        }

        function goHome() { renderLaciView(); }

        renderLaciView();
    </script>

</body>
</html>
